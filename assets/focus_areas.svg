<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="850" height="160">
    <style>
        .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #c9d1d9; }
        .desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #8b949e; line-height: 1.6; }
        .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 12; ry: 12; }
    </style>
    
    <!-- Detection Card -->
    <rect x="0" y="10" width="270" height="130" class="card" />
    <!-- Icon/Accent -->
    <circle cx="25" cy="35" r="6" fill="#3fb950" />
    <text x="40" y="40" class="title">Detection</text>
    <text x="25" y="70" class="desc">SIEM monitoring</text>
    <text x="25" y="95" class="desc">Windows event logs</text>
    <text x="25" y="120" class="desc">Alert triage</text>

    <!-- Investigation Card -->
    <rect x="290" y="10" width="270" height="130" class="card" />
    <!-- Icon/Accent -->
    <circle cx="315" cy="35" r="6" fill="#a371f7" />
    <text x="330" y="40" class="title">Investigation</text>
    <text x="315" y="70" class="desc">Log analysis</text>
    <text x="315" y="95" class="desc">Digital forensics</text>
    <text x="315" y="120" class="desc">Incident context</text>

    <!-- Defense Card -->
    <rect x="580" y="10" width="270" height="130" class="card" />
    <!-- Icon/Accent -->
    <circle cx="605" cy="35" r="6" fill="#58a6ff" />
    <text x="620" y="40" class="title">Defense</text>
    <text x="605" y="70" class="desc">Blue-team labs</text>
    <text x="605" y="95" class="desc">Response simulations</text>
    <text x="605" y="120" class="desc">Network monitoring</text>
</svg>
