    <text x="634" y="118" fill="#60A5FA" font-size="15">degree.exe</text>
    <text x="634" y="143" fill="#86EFAC" font-size="14">B.Sc. in Computer Science &amp; Engineering</text>

    <text x="612" y="188" fill="#F87171" font-size="15">$</text>
    <text x="634" y="188" fill="#60A5FA" font-size="15">focus.exe</text>
    <text x="634" y="213" fill="#86EFAC" font-size="15">Defensive Security · SOC Analyst</text>

