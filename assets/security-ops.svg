    <text x="70" y="328" fill="#F87171" font-size="15">$</text>
    <text x="92" y="328" fill="#60A5FA" font-size="15">university.exe</text>
    <text x="92" y="353" fill="#86EFAC" font-size="14">Pabna University of Science and Technology (PUST)</text>

    <text x="70" y="398" fill="#F87171" font-size="15">$</text>
