<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Shakibul Islam professional cybersecurity terminal</title>
  <desc id="desc">A static modern terminal showing Shakibul Islam's cybersecurity profile, education, location, and focus.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D14"/>
      <stop offset=".62" stop-color="#0D1624"/>
      <stop offset="1" stop-color="#090D17"/>
    </linearGradient>
    <linearGradient id="edge" x1="32" y1="24" x2="1168" y2="476" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#334155" stop-opacity=".55"/>
      <stop offset="1" stop-color="#86EFAC" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#334155" stroke-opacity=".18"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="498" rx="18" fill="url(#surface)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="460" rx="12" fill="url(#grid)"/>
  <path d="M20 72H1180" stroke="#334155" stroke-opacity=".75"/>
  <path d="M46 96V452" stroke="#60A5FA" stroke-opacity=".34"/>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <circle cx="48" cy="46" r="6" fill="#FF5F56"/>
    <circle cx="68" cy="46" r="6" fill="#FFBD2E"/>
    <circle cx="88" cy="46" r="6" fill="#27C93F"/>
    <text x="116" y="51" fill="#94A3B8" font-size="12" letter-spacing="2">shakibul742@profile:~</text>
    <text x="1040" y="51" fill="#86EFAC" font-size="11" letter-spacing="1">SESSION ACTIVE</text>

    <text x="70" y="118" fill="#F87171" font-size="15">$</text>
    <text x="92" y="118" fill="#60A5FA" font-size="15">whoami.exe</text>
    <text x="92" y="143" fill="#86EFAC" font-size="15">CyberSecurity Learner</text>

    <text x="70" y="188" fill="#F87171" font-size="15">$</text>
