<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Shakibul security operations console</title>
  <desc id="desc">An animated dark security operations interface with scanning telemetry and active status indicators.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset="0.55" stop-color="#0A1220"/>
      <stop offset="1" stop-color="#090B16"/>
    </linearGradient>
    <linearGradient id="edge" x1="52" y1="24" x2="1148" y2="296" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#334155" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset=".45" stop-color="#67E8F9" stop-opacity=".08"/>
      <stop offset=".75" stop-color="#67E8F9" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E0FBFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1036 122) rotate(90) scale(102)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#334155" stroke-opacity=".23" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#panel)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="280" rx="12" fill="url(#grid)"/>
  <path d="M20 208H1180" stroke="#334155" stroke-opacity=".55"/>
  <path d="M776 40V282" stroke="#334155" stroke-opacity=".5"/>

  <g opacity=".7">
    <circle cx="48" cy="48" r="5" fill="#FB7185"/>
    <circle cx="66" cy="48" r="5" fill="#FBBF24"/>
    <circle cx="84" cy="48" r="5" fill="#4ADE80"/>
    <text x="112" y="52" fill="#64748B" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">OPS.CONSOLE / PROFILE</text>
  </g>

  <g filter="url(#soft-glow)" opacity=".36">
    <path d="M52 250C144 202 188 286 280 240S425 216 508 249 664 271 748 223" stroke="#22D3EE" stroke-width="6" fill="none"/>
  </g>
  <path d="M52 250C144 202 188 286 280 240S425 216 508 249 664 271 748 223" stroke="#67E8F9" stroke-opacity=".75" stroke-width="1.5" fill="none" stroke-dasharray="5 7">
    <animate attributeName="stroke-dashoffset" values="0;-48" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M52 267C143 239 196 280 284 259S438 248 521 267 654 276 748 246" stroke="#A78BFA" stroke-opacity=".45" stroke-width="1" fill="none"/>

  <g filter="url(#glow)">
    <circle r="4" fill="#E0FBFF">
      <animateMotion dur="4.6s" repeatCount="indefinite" path="M52 250C144 202 188 286 280 240S425 216 508 249 664 271 748 223"/>
    </circle>
  </g>

  <g>
    <rect x="-260" y="21" width="260" height="278" fill="url(#scan)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1440 0" dur="5.4s" repeatCount="indefinite"/>
  </g>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <text x="62" y="104" fill="#E2E8F0" font-size="34" font-weight="700" letter-spacing="2">SHAKIBUL</text>
    <text x="64" y="132" fill="#67E8F9" font-size="12" letter-spacing="3">SECURITY OPERATIONS / BLUE TEAM</text>
    <text x="64" y="162" fill="#94A3B8" font-size="13">SIGNAL  →  CONTEXT  →  DECISION</text>
    <text x="64" y="185" fill="#64748B" font-size="11">detection  ·  investigation  ·  response</text>

    <text x="64" y="232" fill="#475569" font-size="10" letter-spacing="2">TELEMETRY.FEED</text>
    <text x="64" y="288" fill="#64748B" font-size="10">nodes online</text>
    <text x="196" y="288" fill="#67E8F9" font-size="10">04</text>
    <text x="252" y="288" fill="#64748B" font-size="10">mode</text>
    <text x="302" y="288" fill="#A78BFA" font-size="10">LEARNING</text>
    <text x="409" y="288" fill="#64748B" font-size="10">focus</text>
    <text x="460" y="288" fill="#67E8F9" font-size="10">SOC</text>
  </g>

  <g transform="translate(1036 123)">
    <circle r="102" fill="url(#halo)"/>
    <circle r="74" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="52" fill="#0B1422" stroke="#67E8F9" stroke-opacity=".55"/>
    <circle r="38" fill="none" stroke="#67E8F9" stroke-opacity=".38" stroke-dasharray="2 4"/>
    <circle r="8" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="r" values="7;10;7" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".75;1;.75" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="none" stroke="#22D3EE" stroke-opacity=".42" stroke-width="1">
      <animate attributeName="r" values="14;34;14" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;0;.8" dur="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" text-anchor="middle">
    <text x="1036" y="215" fill="#67E8F9" font-size="10" letter-spacing="2">STATUS</text>
    <text x="1036" y="232" fill="#E2E8F0" font-size="12" letter-spacing="2">MONITORING</text>
  </g>

  <g transform="translate(814 238)">
    <rect width="322" height="42" rx="6" fill="#0B1422" stroke="#334155"/>
    <circle cx="22" cy="21" r="4" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;.2;.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="25" fill="#94A3B8" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11">DEFENSIVE POSTURE:</text>
    <text x="238" y="25" fill="#67E8F9" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">ACTIVE</text>
    <rect x="284" y="13" width="7" height="16" fill="#67E8F9">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
