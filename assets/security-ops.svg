    <text x="612" y="408" fill="#64748B" font-size="10" letter-spacing="2">PROFILE / VERIFIED INFORMATION</text>
    <path d="M612 424H1114" stroke="#60A5FA" stroke-opacity=".35"/>
    <rect x="612" y="439" width="312" height="25" rx="4" fill="#0B1726" stroke="#334155"/>
    <text x="628" y="456" fill="#F87171" font-size="11">$</text>
    <text x="646" y="456" fill="#60A5FA" font-size="11">ready_for_next_command</text>
    <rect x="820" y="444" width="6" height="13" fill="#86EFAC" filter="url(#soft-glow)"/>
  </g>
</svg>
