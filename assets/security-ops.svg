<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Shakibul Islam cybersecurity terminal</title>
  <desc id="desc">An animated professional terminal interface for CyberSecurity Learner Shakibul Islam.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B12"/>
      <stop offset=".58" stop-color="#0A1320"/>
      <stop offset="1" stop-color="#090C16"/>
    </linearGradient>
    <linearGradient id="edge" x1="42" y1="30" x2="1158" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity=".8"/>
      <stop offset=".48" stop-color="#334155" stop-opacity=".45"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="340" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset=".58" stop-color="#7DD3FC" stop-opacity=".05"/>
      <stop offset=".82" stop-color="#7DD3FC" stop-opacity=".42"/>
      <stop offset="1" stop-color="#E0F7FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".2"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#surface)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="260" rx="12" fill="url(#grid)"/>
  <path d="M20 70H1180M20 225H1180M822 70V225" stroke="#334155" stroke-opacity=".52"/>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <circle cx="48" cy="46" r="5" fill="#FB7185"/>
    <circle cx="66" cy="46" r="5" fill="#FBBF24"/>
    <circle cx="84" cy="46" r="5" fill="#4ADE80"/>
    <text x="112" y="50" fill="#64748B" font-size="11" letter-spacing="2">IDENTITY.TERMINAL / ONLINE</text>

    <text x="58" y="122" fill="#E2E8F0" font-size="34" font-weight="700" letter-spacing="1.5">SHAKIBUL ISLAM</text>
    <text x="60" y="150" fill="#7DD3FC" font-size="12" letter-spacing="3">CYBERSECURITY LEARNER</text>
    <text x="60" y="181" fill="#94A3B8" font-size="13">defensive operations · threat analysis · digital forensics</text>
    <text x="60" y="207" fill="#64748B" font-size="11">learning in public, investigating with evidence</text>

    <text x="60" y="252" fill="#475569" font-size="10" letter-spacing="2">OPERATOR</text>
    <text x="174" y="252" fill="#7DD3FC" font-size="11">shakibul742</text>
    <text x="288" y="252" fill="#475569" font-size="10" letter-spacing="2">MODE</text>
    <text x="354" y="252" fill="#A5B4FC" font-size="11">LEARNING</text>
  </g>

  <g transform="translate(872 98)" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace">
    <text x="0" y="0" fill="#475569" font-size="10" letter-spacing="2">SYSTEM.STATUS</text>
    <circle cx="18" cy="34" r="5" fill="#7DD3FC" filter="url(#glow)">
      <animate attributeName="opacity" values="1;1;.2;.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="38" fill="#E2E8F0" font-size="13" letter-spacing="1">ACTIVE</text>
    <text x="0" y="72" fill="#64748B" font-size="11">posture</text>
    <text x="92" y="72" fill="#7DD3FC" font-size="11">DEFENSIVE</text>
    <text x="0" y="101" fill="#64748B" font-size="11">signal</text>
    <text x="92" y="101" fill="#A5B4FC" font-size="11">MONITORING</text>
  </g>

  <g>
    <rect x="-340" y="21" width="340" height="258" fill="url(#scan)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;1540 0" dur="5.8s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(58 243)">
    <path d="M0 21H682" stroke="#7DD3FC" stroke-opacity=".18" stroke-width="1"/>
    <path d="M0 21H93L137 7 181 31 242 17 304 25 357 3 409 28 468 14 531 23 586 8 682 21" fill="none" stroke="#7DD3FC" stroke-width="1.5" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <circle r="4" fill="#E0F7FF" filter="url(#glow)">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M0 21H93L137 7 181 31 242 17 304 25 357 3 409 28 468 14 531 23 586 8 682 21"/>
    </circle>
  </g>

  <g transform="translate(846 241)">
    <rect width="290" height="28" rx="5" fill="#0D1828" stroke="#334155"/>
    <text x="16" y="19" fill="#7DD3FC" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10">$ whoami.exe</text>
    <rect x="112" y="8" width="6" height="13" fill="#7DD3FC">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
