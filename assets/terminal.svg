<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="850" height="380">
    <style>
        .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #a1a1aa; font-weight: 500; text-anchor: middle; }
        .text { font-family: 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 14.5px; fill: #e4e4e7; }
        .prompt-user { fill: #4ade80; font-weight: 600; }
        .prompt-dir { fill: #60a5fa; font-weight: 600; }
        .command { fill: #e4e4e7; }
        .exe { fill: #f87171; font-weight: 500; }
        .value { fill: #38bdf8; }
        .dim { fill: #71717a; }
        .blink { animation: blinker 1s step-start infinite; fill: #a1a1aa; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
    
    <!-- Background -->
    <rect x="0" y="0" width="850" height="380" rx="10" ry="10" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="850" height="36" rx="10" ry="10" fill="#27272a"/>
    <rect x="0" y="20" width="850" height="16" fill="#27272a"/>
    <line x1="0" y1="36" x2="850" y2="36" stroke="#3f3f46" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="20" cy="18" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="18" r="5.5" fill="#f59e0b"/>
    <circle cx="56" cy="18" r="5.5" fill="#22c55e"/>

    <!-- Title -->
    <text x="425" y="23" class="title">shakibul742@security: ~</text>

    <!-- Content -->
    <g class="text">
        <!-- Execution command -->
        <text x="25" y="75">
            <tspan class="prompt-user">shakibul742@security</tspan><tspan class="dim">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="dim">$ </tspan><tspan class="command">./about_me.exe</tspan>
        </text>
        
        <!-- LEFT COLUMN (x=25) -->
        <text x="25" y="115"><tspan class="exe">&gt; whoami.exe</tspan></text>
        <text x="45" y="140"><tspan class="value">CyberSecurity Learner</tspan></text>

        <text x="25" y="175"><tspan class="exe">&gt; username.exe</tspan></text>
        <text x="45" y="200"><tspan class="value">shakibul742</tspan></text>

        <text x="25" y="235"><tspan class="exe">&gt; name.exe</tspan></text>
        <text x="45" y="260"><tspan class="value">SHAKIBUL ISLAM</tspan></text>
        
        <text x="25" y="295"><tspan class="exe">&gt; Location.exe</tspan></text>
        <text x="45" y="320"><tspan class="value">Bangladesh</tspan></text>

        <!-- RIGHT COLUMN (x=440) -->
        <text x="440" y="115"><tspan class="exe">&gt; university.exe</tspan></text>
        <text x="460" y="140"><tspan class="value">Pabna University of Science and Technology(PUST)</tspan></text>

        <text x="440" y="175"><tspan class="exe">&gt; Degree.exe</tspan></text>
        <text x="460" y="200"><tspan class="value">B.Sc. in Computer Science &amp; Engineering</tspan></text>
        
        <text x="440" y="235"><tspan class="exe">&gt; Focus.exe</tspan></text>
        <text x="460" y="260"><tspan class="value">Defensive Security, SOC Analyst</tspan></text>
        
        <!-- Next Prompt -->
        <text x="25" y="360">
            <tspan class="prompt-user">shakibul742@security</tspan><tspan class="dim">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="dim">$ </tspan><tspan class="blink">█</tspan>
        </text>
    </g>
</svg>
